<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>
</head>
<body>
    <script>
        // Array com os horários da agenda
const agendaHorarios = [8, 12, 25, 15, -2, 20];

// Variável para contar horários válidos
let contagemValidos = 0;

// Percorre todos os horários da lista
for (const horario of agendaHorarios) {

  // Verifica se o horário é válido
  if (horario >= 0 && horario <= 23) {
    console.log(`Compromisso agendado para as ${horario}h`);
    contagemValidos++;
  } else {
    console.log(`Atenção: O horário ${horario}h é inválido!`);
  }
}

// Exibe o total de compromissos válidos
console.log(`Total de compromissos válidos: ${contagemValidos}`);

    </script>
</body>
</html>
