<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Cartão de Visitas</title>

    <style>
        :root {
            --card-color: #3498db;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
        }

        .wrapper {
            display: flex;
            gap: 30px;
        }

        /* FORMULÁRIO */
        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        .form input,
        .form select {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            font-size: 15px;
        }

        /* CARTÃO */
        .card {
            width: 300px;
            height: 180px;
            background: var(--card-color);
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            transition: background 0.3s;
        }

        .card h2 {
            margin: 0;
        }

        .card p {
            margin: 5px 0 0;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <div class="form">
        <h3>Dados do Cartão</h3>

        <input 
            type="text" 
            placeholder="Nome"
            oninput="atualizarNome(this.value)">

        <input 
            type="text" 
            placeholder="Cargo"
            oninput="atualizarCargo(this.value)">

        <select onchange="mudarCor(this.value)">
            <option value="#3498db">Azul</option>
            <option value="#e74c3c">Vermelho</option>
            <option value="#2ecc71">Verde</option>
            <option value="#9b59b6">Roxo</option>
            <option value="#f39c12">Laranja</option>
        </select>
    </div>

    <div class="card">
        <h2 id="nome">Seu Nome</h2>
        <p id="cargo">Seu Cargo</p>
    </div>

</div>

<script>
    function atualizarNome(valor) {
        document.getElementById("nome").innerText = valor || "Seu Nome";
    }

    function atualizarCargo(valor) {
        document.getElementById("cargo").innerText = valor || "Seu Cargo";
    }

    function mudarCor(cor) {
        document.documentElement.style.setProperty('--card-color', cor);
    }
</script>

</body>
</html>
