    <title>Exercício 1</title>
</head>
<body>
    <script>
let hora = 12;
let prioridade = 9;

if (hora < 0 || hora > 23) {
    console.log("Horário Inválido");
}

else if (prioridade < 1 || prioridade > 10) {
    console.log("Nível de Prioridade Inválida");
}

else {
    
    if ((hora >= 0 && hora <= 11) || (hora >= 12 && hora <= 17)) {

        if (prioridade > 8) {
            console.log("TAREFA CRÍTICA/URGENTE");
        }
        else if (prioridade >= 7 && prioridade < 9) {
            console.log("TAREFA IMPORTANTE");
        }
    }

    else if (hora >= 18 && hora <= 23) {
        console.log("TAREFA NÃO IMPORTANTE");
    }
}
</script>
</body>
