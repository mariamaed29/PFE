<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    <script>
        (function() {
            
            const hoje = new Date();
            const hojeSemHora = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
            const dataEvento = new Date(2026, 2, 1);
            const diferencaMs = dataEvento - hojeSemHora;
            const msPorDia = 24 * 60 * 60 * 1000;
            const dias = Math.ceil(diferencaMs / msPorDia);

            let mensagem;
            if (diferencaMs > 0) {
                mensagem = `Faltam ${dias} dias para o seu compromisso!`;
            } else if (diferencaMs === 0) {
            } else {
                mensagem = 'O compromisso já ocorreu.';
            }

            console.log(mensagem);
            document.body.innerHTML = `
                <h1>Calculadora de Dias</h1>
                <p>Hoje: ${hojeSemHora.toLocaleDateString()}</p>
                <p>Data do evento: ${dataEvento.toLocaleDateString()}</p>
                <p><strong>${mensagem}</strong></p>
                <p>Para testar outra data, edite a variável <code>dataEvento</code> no topo do script.</p>
            `;
        })();
    </script>
</body>
</html>
