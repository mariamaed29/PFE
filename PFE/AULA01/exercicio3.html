<body>
    <script>
        function limparNomeContato(nome) {
  
  const nomeSemEspacos = nome.trim();
  const nomeFormatado = nomeSemEspacos.toUpperCase();
  const palavras = nomeFormatado.split(" ");
  const palavrasValidas = palavras.filter(palavra => palavra.length > 0);
  const quantidadePalavras = palavrasValidas.length;

  return {
    nomeFormatado: nomeFormatado,
    quantidadePalavras: quantidadePalavras
  };
}

const resultado = limparNomeContato("  joão   silva  ");

console.log(resultado.nomeFormatado);  
console.log(resultado.quantidadePalavras); 

    </script>
</body>
